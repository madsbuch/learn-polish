[package]
name = "learn-polish"
version = "0.1.0"
description = "Learn Polish from English or Danish — daily gamified practice"
authors = ["Mads Buch"]
edition = "2021"
rust-version = "1.77.2"

# The lib is what Android/iOS link against; the bin is the desktop entrypoint.
[lib]
name = "learn_polish_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset lets the webview stream downloaded songs straight from disk.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.9"
# Generated speech crosses the IPC boundary as a data: URI.
base64 = "0.22"

# SQLite is compiled in (`bundled`) so Android/macOS do not depend on a system libsqlite3.
rusqlite = { version = "0.37", features = ["bundled"] }

# All outbound HTTP lives in Rust so the webview never issues cross-origin
# requests — no CORS preflight, and the OpenRouter key never reaches JS.
# webpki roots are bundled so TLS works identically on Android and macOS.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-webpki-roots",
  "charset",
  "http2",
  "stream",
] }
# Consuming the server-sent-event body of a streaming completion.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[features]
# This feature is used for production builds where `devUrl` points to the filesystem.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
