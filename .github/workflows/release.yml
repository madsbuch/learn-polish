name: Build and publish latest

# Every merge to main replaces the rolling "latest" release with fresh builds.
# Pull requests test and compile Android and macOS too; only main publishes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes an older run pointless.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Content and UI are compiled in, so builds are reproducible from the repo alone.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Pull requests read the cache but never overwrite main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev pkg-config

      - run: bun install --frozen-lockfile

      - name: Type-check and build the frontend
        run: bun run build

      - name: Rust lints (no unsafe, no `as` casts)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: The screens' zod schemas match what the core sends
        run: bun scripts/check-shapes.ts

  # The build starts alongside the tests instead of waiting for them; only
  # publishing waits for the tests to pass.
  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle's downloads and build cache between runs.
      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;36.0.0 platforms;android-36 ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - run: bun install --frozen-lockfile

      - name: Locate the NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Generate and prepare the Android project
        run: bun run android:init

      # Phones only: 64-bit and 32-bit ARM. x86_64 was for emulators and cost a
      # third of the Rust compile time.
      - name: Build the release APK
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          export VITE_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/stamp-version.mjs
          bun run android:build

      - name: Sign the APK with the release key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p out
          trap 'rm -f key.jks aligned.apk' EXIT

          : "${KEYSTORE_BASE64:?Configure ANDROID_KEYSTORE_BASE64 before releasing}"
          : "${KEYSTORE_PASSWORD:?Configure ANDROID_KEYSTORE_PASSWORD before releasing}"
          : "${KEY_PASSWORD:?Configure ANDROID_KEY_PASSWORD before releasing}"
          : "${KEY_ALIAS:?Configure ANDROID_KEY_ALIAS before releasing}"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > key.jks

          # Tauri names the output directory after the ABI set it built, so find
          # the APK rather than assuming "universal".
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected one combined release APK; found ${#apks[@]}." >&2
            find src-tauri/gen/android/app/build/outputs -type f >&2 || true
            exit 1
          fi
          apk="${apks[0]}"

          "$tools/zipalign" -P 16 -f 4 "$apk" aligned.apk
          "$tools/apksigner" sign \
            --ks key.jks --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out out/Polski-android-universal.apk aligned.apk
          "$tools/apksigner" verify --print-certs out/Polski-android-universal.apk
          "$tools/zipalign" -c -P 16 4 out/Polski-android-universal.apk
          # apksigner also writes a v4 signature file for incremental installs;
          # it is not needed to install the APK, so keep it out of the release.
          rm -f out/*.idsig
          rm -f key.jks aligned.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android
          # Fork PRs have no secrets; their APK is compiled but never signed or published.
          path: ${{ github.event_name == 'pull_request' && 'src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk' || 'out/*' }}
          if-no-files-found: error

  macos:
    name: macOS (DMG)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # One universal app runs natively on both Apple Silicon and Intel Macs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: bun install --frozen-lockfile

      # No Apple Developer ID yet, so the app is ad-hoc signed ("-"): Apple
      # Silicon refuses to run unsigned code at all, and ad-hoc is enough to
      # launch once Gatekeeper is told to allow it (see the release notes).
      - name: Build the universal app and DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          export VITE_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/stamp-version.mjs
          bun run tauri build --target universal-apple-darwin --bundles dmg --ci

      - name: Collect the DMG
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected one DMG; found ${#dmgs[@]}." >&2
            find src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 2 >&2 || true
            exit 1
          fi
          cp "${dmgs[0]}" out/Polski-macos-universal.dmg
          ls -lh out

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish latest
    permissions:
      contents: write
    needs: [check, android, macos]
    # Only main publishes. A manual run on another branch still builds the
    # APK and DMG and keeps them as workflow artefacts, for testing before merging.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artefacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release

      - name: Move the latest tag to this commit
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - name: Compose release notes
        env:
          # Passed through the environment so quotes and newlines in the commit
          # message cannot break the shell.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          cat > notes.md <<'HEADER'
          Rolling build of `main`. Replaced on every merge.

          ### Install

          **Android** — download `Polski-android-universal.apk`, then open it on the
          phone and allow installation from this source. Notifications need to be
          granted once, in the app's Settings screen.

          **macOS** — download `Polski-macos-universal.dmg` (Apple Silicon and Intel,
          macOS 10.15 or later), open it and drag Polski into Applications. The app is
          not notarized yet, so the first launch is blocked: either run
          `xattr -dr com.apple.quarantine /Applications/Polski.app` in Terminal, or try to
          open it once and then choose *Open Anyway* in System Settings → Privacy &
          Security.

          HEADER
          {
            echo "### This build"
            echo
            echo "- Commit \`${GITHUB_SHA::7}\` — ${COMMIT_MESSAGE:-manual run}" | head -1
            echo "- Built $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> notes.md

      # Start from an empty release each time, so no asset from an older build
      # (or a platform that is no longer built) is left behind. The tag stays.
      - name: Remove the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          body_path: notes.md
          files: release/*
          draft: false
          prerelease: false
          make_latest: true
          # Point the `latest` tag at this commit instead of leaving it behind.
          target_commitish: ${{ github.sha }}
